name: Generate Siri Wake Word Samples

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts pydub

      - name: Generate Siri samples
        run: |
          python << 'EOF'
          import asyncio
          import edge_tts
          from pydub import AudioSegment
          import os
          import random

          os.makedirs('siri_samples', exist_ok=True)

          voices = [
              'en-US-AriaNeural',
              'en-US-GuyNeural',
              'en-US-JennyNeural',
              'en-US-DavisNeural',
              'en-GB-SoniaNeural',
              'en-GB-RyanNeural',
              'en-AU-NatashaNeural',
              'en-AU-WilliamNeural',
          ]

          variations = ["Siri", "Hey Siri", "Siri?", "Hello Siri"]

          async def generate_sample(i):
              voice = random.choice(voices)
              text = random.choice(variations)
              
              communicate = edge_tts.Communicate(text, voice)
              mp3_file = f'temp_{i}.mp3'
              await communicate.save(mp3_file)
              
              audio = AudioSegment.from_mp3(mp3_file)
              audio = audio.set_frame_rate(16000).set_channels(1)
              
              if len(audio) > 1500:
                  audio = audio[:1500]
              elif len(audio) < 1500:
                  silence = AudioSegment.silent(duration=1500 - len(audio))
                  audio = audio + silence
              
              audio.export(f'siri_samples/siri_{i:03d}.wav', format='wav')
              os.remove(mp3_file)

          async def main():
              print('Dang tao 100 mau...')
              for i in range(100):
                  await generate_sample(i)
                  if (i+1) % 20 == 0:
                      print(f'{i+1}/100')

          asyncio.run(main())
          print('HOAN THANH!')
          EOF

      - name: Create ZIP
        run: |
          zip -r siri_samples.zip siri_samples/

      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: siri-wake-word-samples
          path: |
            siri_samples.zip
            siri_samples/
