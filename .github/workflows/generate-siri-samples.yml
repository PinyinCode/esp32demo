name: Generate Siri Wake Word Samples

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          pip install gTTS pydub

      - name: Generate Siri samples (Male + Female)
        run: |
          python << 'EOF'
          import subprocess
          from gtts import gTTS
          from pydub import AudioSegment
          import os
          import random

          os.makedirs('siri_samples', exist_ok=True)

          variations = ["Siri", "Hey Siri", "Siri?", "Hello Siri", "Siri please"]
          male_variations = ["Siri", "Hey Siri", "Siri", "Hello Siri"]

          def create_female_sample(text, filename):
              """Giọng nữ - gTTS"""
              tts = gTTS(text=text, lang='en', slow=random.choice([True, False]))
              mp3_file = filename.replace('.wav', '.mp3')
              tts.save(mp3_file)
              audio = AudioSegment.from_mp3(mp3_file)
              os.remove(mp3_file)
              return audio

          def create_male_sample(text, filename):
              """Giọng nam - espeak"""
              wav_file = filename
              subprocess.run([
                  'espeak', '-v', 'en+m3',  # m3 = giọng nam
                  '-s', str(random.randint(140, 180)),  # Tốc độ
                  '-w', wav_file,
                  text
              ], capture_output=True)
              audio = AudioSegment.from_wav(wav_file)
              return audio

          print('Dang tao 100 mau (50 nam + 50 nu)...')
          for i in range(100):
              text = random.choice(variations)
              
              if i < 50:
                  # 50 mẫu GIỌNG NỮ (gTTS)
                  try:
                      audio = create_female_sample(text, f'temp_{i}.wav')
                      gender = "NU"
                  except Exception as e:
                      print(f'Loi nu {i}: {e}')
                      continue
              else:
                  # 50 mẫu GIỌNG NAM (espeak)
                  try:
                      audio = create_male_sample(text, f'temp_{i}.wav')
                      gender = "NAM"
                  except Exception as e:
                      print(f'Loi nam {i}: {e}')
                      continue
              
              # Chuẩn hóa
              audio = audio.set_frame_rate(16000).set_channels(1)
              
              if len(audio) > 1500:
                  audio = audio[:1500]
              elif len(audio) < 1500:
                  silence = AudioSegment.silent(duration=1500 - len(audio))
                  audio = audio + silence
              
              audio.export(f'siri_samples/siri_{i:03d}_{gender}.wav', format='wav')
              
              if os.path.exists(f'temp_{i}.wav'):
                  os.remove(f'temp_{i}.wav')
              
              if (i+1) % 20 == 0:
                  print(f'{i+1}/100')

          print('HOAN THANH!')
          EOF

      - name: Create ZIP
        run: |
          zip -r siri_samples.zip siri_samples/

      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: siri-wake-word-samples
          path: |
            siri_samples.zip
            siri_samples/
