name: Generate Siri Wake Word Samples

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          pip install gTTS pydub

      - name: Generate Siri samples (Diverse voices)
        run: |
          python << 'EOF'
          import subprocess
          from gtts import gTTS
          from pydub import AudioSegment
          import os
          import random

          os.makedirs('siri_samples', exist_ok=True)

          variations = ["Siri", "Hey Siri", "Siri?", "Hello Siri", "Siri please"]

          def process_audio(audio):
              """Áp dụng hiệu ứng ngẫu nhiên cho mỗi mẫu"""
              pitch_factor = random.uniform(0.85, 1.15)
              new_frame_rate = int(audio.frame_rate * pitch_factor)
              audio = audio._spawn(audio.raw_data, overrides={
                  "frame_rate": new_frame_rate
              }).set_frame_rate(16000)
              
              volume_change = random.randint(-8, 8)
              audio = audio + volume_change
              
              if len(audio) > 1500:
                  audio = audio[:1500]
              elif len(audio) < 1500:
                  silence = AudioSegment.silent(duration=1500 - len(audio))
                  audio = audio + silence
              
              return audio

          print('Dang tao 100 mau da dang...')
          for i in range(100):
              text = random.choice(variations)
              audio = None
              gender = ""
              
              if i < 50:
                  # ===== GIỌNG NỮ (gTTS) =====
                  try:
                      tts = gTTS(text=text, lang='en', slow=random.choice([True, False]))
                      mp3_file = f'temp_{i}.mp3'
                      tts.save(mp3_file)
                      audio = AudioSegment.from_mp3(mp3_file)
                      os.remove(mp3_file)
                      gender = "NU"
                  except Exception as e:
                      print(f'Loi nu {i}: {e}')
                      continue
              else:
                  # ===== GIỌNG NAM (espeak) =====
                  try:
                      espeak_voices = ['en+m3', 'en+m4', 'en+m5', 'en+m6', 'en+m7']
                      voice = random.choice(espeak_voices)
                      speed = random.randint(130, 200)
                      
                      wav_file = f'temp_{i}.wav'
                      subprocess.run([
                          'espeak', '-v', voice,
                          '-s', str(speed),
                          '-p', str(random.randint(30, 70)),
                          '-w', wav_file,
                          text
                      ], capture_output=True)
                      
                      audio = AudioSegment.from_wav(wav_file)
                      os.remove(wav_file)
                      gender = "NAM"
                  except Exception as e:
                      print(f'Loi nam {i}: {e}')
                      continue
              
              # Xử lý hiệu ứng
              audio = process_audio(audio)
              audio = audio.set_frame_rate(16000).set_channels(1)
              
              # Lưu
              audio.export(f'siri_samples/siri_{i:03d}_{gender}.wav', format='wav')
              
              if (i+1) % 20 == 0:
                  print(f'{i+1}/100')

          print('HOAN THANH!')
          EOF

      - name: Create ZIP
        run: |
          zip -r siri_samples.zip siri_samples/

      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: siri-wake-word-samples
          path: |
            siri_samples.zip
            siri_samples/
