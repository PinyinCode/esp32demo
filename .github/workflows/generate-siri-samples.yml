name: Generate Siri Wake Word Samples

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install gTTS pydub

      - name: Generate Siri samples
        run: |
          python << 'EOF'
          from gtts import gTTS
          from pydub import AudioSegment
          import os

          os.makedirs('siri_samples', exist_ok=True)

          print('Dang tao 100 mau Siri...')
          for i in range(100):
              tts = gTTS(text='Siri', lang='en', slow=False)
              mp3_file = f'temp_{i}.mp3'
              tts.save(mp3_file)
              
              audio = AudioSegment.from_mp3(mp3_file)
              audio = audio.set_frame_rate(16000).set_channels(1)
              
              if len(audio) > 1500:
                  audio = audio[:1500]
              elif len(audio) < 1500:
                  silence = AudioSegment.silent(duration=1500 - len(audio))
                  audio = audio + silence
              
              wav_file = f'siri_samples/siri_{i:03d}.wav'
              audio.export(wav_file, format='wav')
              os.remove(mp3_file)
              
              if (i+1) % 20 == 0:
                  print(f'Da tao {i+1}/100 mau')

          print('HOAN THANH!')
          EOF

      - name: Create ZIP
        run: |
          zip -r siri_samples.zip siri_samples/

      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: siri-wake-word-samples
          path: |
            siri_samples.zip
            siri_samples/
